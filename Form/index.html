<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Profile Form</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="form-icon.webp" type="image/x-icon">
</head>

<body class="bg-gray-100">

    <div class=" min-h-screen flex items-center justify-center px-4 py-16">

        <div class="w-full max-w-[650px] bg-white rounded-[16px] shadow-xl p-8">

            <!-- Heading -->
            <div class="mb-8">

                <h1 class="text-[30px] font-bold text-gray-900">
                    Developer Profile
                </h1>

                <p class="text-gray-500 mt-2 text-[15px]">
                    Enter your details and tell us about your role in the IT industry.
                </p>

            </div>


            <!-- Form -->
            <form id="developer_form">


                <!-- Full Name -->
                <div class="mb-5">

                    <label for="name" class="block text-[14px] font-medium text-gray-700 mb-2">
                        Full Name
                    </label>

                    <input type="text" id="name" placeholder="Enter your full name"
                        class="w-full border border-gray-300 rounded-[10px] px-4 py-3 text-[15px] outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition">

                </div>


                <!-- Email -->
                <div class="mb-5">

                    <label for="email" class="block text-[14px] font-medium text-gray-700 mb-2">
                        Email Address
                    </label>

                    <input type="email" id="email" placeholder="you@example.com"
                        class="w-full border border-gray-300 rounded-[10px] px-4 py-3 text-[15px] outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition">

                </div>


                <!-- IT Role -->
                <div class="mb-5">

                    <label for="role" class="block text-[14px] font-medium text-gray-700 mb-2">
                        IT Role
                    </label>

                    <select id="role"
                        class="w-full border border-gray-300 rounded-[10px] px-4 py-3 text-[15px] text-gray-700 outline-none bg-white focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition">

                        <option value="">
                            Select your role
                        </option>

                        <option value="Frontend Developer">
                            Frontend Developer
                        </option>

                        <option value="Backend Developer">
                            Backend Developer
                        </option>

                        <option value="Full Stack Developer">
                            Full Stack Developer
                        </option>

                        <option value="UI/UX Designer">
                            UI/UX Designer
                        </option>

                        <option value="SEO Specialist">
                            SEO Specialist
                        </option>

                        <option value="DevOps Engineer">
                            DevOps Engineer
                        </option>

                        <option value="Data Analyst">
                            Data Analyst
                        </option>

                        <option value="Cybersecurity">
                            Cybersecurity
                        </option>

                        <option value="Project Manager">
                            Project Manager
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Experience -->
                <div class="mb-6">

                    <label for="experience" class="block text-[14px] font-medium text-gray-700 mb-2">
                        Experience
                    </label>

                    <select id="experience"
                        class="w-full border border-gray-300 rounded-[10px] px-4 py-3 text-[15px] text-gray-700 outline-none bg-white focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition">

                        <option value="">
                            Select experience
                        </option>

                        <option value="0-1">
                            0 - 1 Years
                        </option>

                        <option value="1-3">
                            1 - 3 Years
                        </option>

                        <option value="3-5">
                            3 - 5 Years
                        </option>

                        <option value="5-10">
                            5 - 10 Years
                        </option>

                        <option value="10+">
                            10+ Years
                        </option>

                    </select>

                </div>


                <!-- Submit Button -->
                <button type="submit" id="submit_btn"
                    class="w-full bg-gradient-to-r from-green-500 via-green-600 to-green-700 hover:bg-gradient-to-br text-white font-semibold rounded-[10px] py-3 text-[20px] transition hover:cursor-pointer">
                    Add Profile
                </button>


            </form>

        </div>

    </div>

    <h2 class="text-center text-6xl font-bold">PROFILE DATA!</h2>

    <div class="w-[95%] mx-auto mt-[50px] border border-gray-200 rounded-[10px] overflow-hidden mb-10">

        <table class="w-full text-left">

            <thead class="bg-gray-200 border-b border-gray-200">
                <tr>
                    <th class="px-6 py-4 text-center">
                        Name
                    </th>

                    <th class="px-6 py-4 text-center">
                        Email
                    </th>

                    <th class="px-6 py-4 text-center">
                        IT Role
                    </th>

                    <th class="px-6 py-4 text-center">
                        Experience
                    </th>

                    <th class="px-6 py-4 text-center">
                        Action
                    </th>
                </tr>
            </thead>

            <tbody id="profile_list">

            </tbody>

        </table>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
